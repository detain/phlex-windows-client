name: Build

on:
  push:
    branches: [master]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'package.json'
      - 'electron-builder.*'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: false
        type: string

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.x'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check renderer
        run: npx vue-tsc --noEmit

      - name: Type check main process
        run: npx tsc -p tsconfig.main.json --noEmit

      - name: Type check tests
        run: npx vue-tsc --noEmit -p tsconfig.test.json

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Run tests
        run: npm test

  smoke:
    name: Smoke on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      # Windows runners need ~10 min just for npm ci (Electron download) — the
      # previous 10-min timeout cancelled the Windows leg mid-build. Also keep the
      # two legs independent so a Linux failure cannot cancel the Windows result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Run smoke test (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run --auto-servernum npm run smoke

      - name: Run smoke test (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run smoke

  # ─── audit ────────────────────────────────────────────────────────────────────
  # Dependabot was evaluated but not used — this repo follows a no-PR-push-to-master
  # workflow (tags are the release trigger), so Dependabot's PR model doesn't fit.
  # Dependency updates are handled manually or via the tag workflow.
  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    needs: [lint, typecheck, test, smoke, audit]

    strategy:
      matrix:
        include:
          - target: nsis
            runs-on: windows-latest
          - target: appx
            runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build:vite

      - name: Build main process
        run: npm run build:electron

      - name: Package NSIS installer
        if: matrix.target == 'nsis'
        run: npx electron-builder --win nsis --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package APPX
        if: matrix.target == 'appx'
        run: npx electron-builder --win appx --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA256 checksums
        # sha256sum is available on windows-latest; output goes to release/
        # which is already gitignored so no cleanup needed.
        run: |
          cd release
          sha256sum *.exe *.appx *.nupkg > SHA256SUMS.txt 2>/dev/null || echo "No artifacts found" >&2

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: phlix-windows-${{ matrix.target }}
          path: |
            release/*.exe
            release/*.appx
            release/*.nupkg
            release/SHA256SUMS.txt
          if-no-files-found: error

  # ─── updater note ─────────────────────────────────────────────────────────────
  # allowPrerelease is NOT set in this repo. The updater feed (latest.yml) follows
  # tagged releases only and is generated at release time. If @phlix/ui (the
  # consuming package) implements its own electron-updater auto-updater consumption,
  # allowPrerelease: false would be set there — this repo only hosts the installer
  # artifacts and the feed. For reference, electron-updater's autoUpdater options
  # (allowPrerelease, autoDownload, etc.) are consumed by the client at runtime,
  # not defined in the feed itself.

  # ─── version-check ────────────────────────────────────────────────────────────
  # Runs before any release job. Fails if package.json version does not match
  # the tag being pushed, preventing accidental drift between code and release.
  version-check:
    name: Version drift check
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Extract tag version
        id: tag_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract package.json version
        id: pkg_version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Fail if versions diverge
        run: |
          if [[ "${{ steps.tag_version.outputs.VERSION }}" != "${{ steps.pkg_version.outputs.VERSION }}" ]]; then
            echo "ERROR: tag version '${{ steps.tag_version.outputs.VERSION }}' != package.json version '${{ steps.pkg_version.outputs.VERSION }}'"
            exit 1
          fi
          echo "Version check passed: ${{ steps.tag_version.outputs.VERSION }}"

  release-latest:
    name: Update "latest" prerelease
    needs: build
    # On every master push, overwrite a rolling "latest" GitHub Release carrying
    # the RAW .exe/.appx as directly-downloadable assets. (GitHub Actions
    # artifacts are always served zipped — a Release is the only way to offer a
    # bare, clickable installer.) Skipped on PRs and tag pushes (tags cut a
    # versioned release via the `release` job below).
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download NSIS artifacts
        uses: actions/download-artifact@v8
        with:
          name: phlix-windows-nsis
          path: artifacts/nsis

      - name: Download APPX artifacts
        uses: actions/download-artifact@v8
        with:
          name: phlix-windows-appx
          path: artifacts/appx

      - name: Generate SHA256 checksums for release artifacts
        run: |
          cd artifacts
          sha256sum nsis/*.exe nsis/*.appx nsis/*.nupkg appx/*.exe appx/*.appx appx/*.nupkg > SHA256SUMS.txt 2>/dev/null || echo "No artifacts found" >&2
          cat SHA256SUMS.txt

      - name: Reset "latest" release + tag
        # Delete any existing rolling release and its tag so the recreated one
        # points at this commit and carries only the freshly-built installers
        # (no stale assets from a prior master build accumulate).
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish "latest" prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest (master)
          body: |
            Rolling build of the latest `master` commit (${{ github.sha }}).
            Download the raw installer directly — no zip:
            - **`.exe`** — NSIS installer (desktop install)
            - **`.appx`** — Windows Store / sideload package

            **SHA256SUMS.txt** is included for integrity verification.
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/nsis/*.exe
            artifacts/appx/*.appx
            artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Create Release
    needs: [build, version-check]
    # Only publish a GitHub Release on a version tag — master/PR builds just
    # upload installer artifacts (above) without cutting a release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download NSIS artifacts
        uses: actions/download-artifact@v8
        with:
          name: phlix-windows-nsis
          path: artifacts/nsis

      - name: Download APPX artifacts
        uses: actions/download-artifact@v8
        with:
          name: phlix-windows-appx
          path: artifacts/appx

      # ── Signing (W4.10 blocked on WINDOWS_CERT_BASE64 secret) ─────────────────
      # When the WINDOWS_CERT_BASE64 secret is provisioned, uncomment and fill in:
      #
      #   - name: Decode certificate
      #     run: echo "$WINDOWS_CERT_BASE64" | base64 -d > certificate.pfx
      #     env:
      #       WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
      #
      #   - name: Sign NSIS installer
      #     run: signtool sign /f certificate.pfx /p "$SIGNTOOL_PASSWORD" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "artifacts/nsis/*.exe"
      #     env:
      #       SIGNTOOL_PASSWORD: ${{ secrets.SIGNTOOL_PASSWORD }}
      #
      #   - name: Verify signature
      #     run: signtool verify /pa /v "artifacts/nsis/*.exe"
      # ─────────────────────────────────────────────────────────────────────────

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.event.inputs.version }}" != "" ]]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Generate SHA256 checksums
        id: sha256
        run: |
          cd artifacts
          sha256sum nsis/*.exe nsis/*.nupkg appx/*.appx appx/*.nupkg > SHA256SUMS.txt
          # Also write individual {file}.sha256 files for use in latest.yml
          for f in nsis/*.exe; do
            sha256sum "$f" | awk '{print $1}' > "${f}.sha256"
          done

      - name: Generate latest.yml for NSIS (electron-updater)
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          EXE=$(ls artifacts/nsis/*.exe | head -1)
          EXE_NAME=$(basename "$EXE")
          EXE_SHA256=$(cat "${EXE}.sha256")
          RELEASE_DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          cat > artifacts/latest.yml << YML
          version: ${VERSION}
          releaseDate: "${RELEASE_DATE}"
          path: https://github.com/detain/phlix-windows-client/releases/download/v${VERSION}/${EXE_NAME}
          sha256: ${EXE_SHA256}
          files:
            - url: https://github.com/detain/phlix-windows-client/releases/download/v${VERSION}/${EXE_NAME}
              sha256: ${EXE_SHA256}
              target: nsis
          YML
          cat artifacts/latest.yml

      - name: Generate latest-windows.yml for APPX (electron-updater)
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          APPX=$(ls artifacts/appx/*.appx 2>/dev/null | head -1)
          if [[ -f "$APPX" ]]; then
            APPX_NAME=$(basename "$APPX")
            APPX_SHA256=$(sha256sum "$APPX" | awk '{print $1}')
            RELEASE_DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
            cat > artifacts/latest-windows.yml << YML
            version: ${VERSION}
            releaseDate: "${RELEASE_DATE}"
            path: https://github.com/detain/phlix-windows-client/releases/download/v${VERSION}/${APPX_NAME}
            sha256: ${APPX_SHA256}
            files:
              - url: https://github.com/detain/phlix-windows-client/releases/download/v${VERSION}/${APPX_NAME}
                sha256: ${APPX_SHA256}
                target: appx
            YML
            cat artifacts/latest-windows.yml
          else
            echo "No APPX artifact found — skipping latest-windows.yml"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'alpha') }}
          generate_release_notes: true
          files: |
            artifacts/nsis/*.exe
            artifacts/nsis/*.nupkg
            artifacts/nsis/SHA256SUMS.txt
            artifacts/appx/*.appx
            artifacts/appx/*.nupkg
            artifacts/SHA256SUMS.txt
            artifacts/latest.yml
            artifacts/latest-windows.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
