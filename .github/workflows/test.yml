name: Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      # A failure on one OS must not cancel the other matrix leg — the two legs
      # validate independent surfaces (and the default fail-fast:true already
      # cancelled the Windows results whenever the Ubuntu leg failed).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Build app
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run tests with coverage
        run: npm test -- --coverage
        # NOTE: this MUST be matrix.os, not runner.os. `runner.os` evaluates to
        # Linux/Windows/macOS and can NEVER equal 'ubuntu-latest', so the previous
        # condition was always false and these three steps never ran once.
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24.x'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        # NOTE: this MUST be matrix.os, not runner.os. `runner.os` evaluates to
        # Linux/Windows/macOS and can NEVER equal 'ubuntu-latest', so the previous
        # condition was always false and these three steps never ran once.
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24.x'
        with:
          files: ./coverage/lcov.info
          # The coverage threshold (vitest, see vitest.config.mts) already gates
          # the run — this upload is best-effort. The repo's CODECOV_TOKEN does
          # not currently authorize uploads to this repository ("Repository not
          # found"), and failing CI on an external token issue hides real regressions.
          fail_ci_if_error: false
          # master is a protected branch — Codecov rejects anonymous uploads to it
          # ("Token required because branch is protected"), so pass the provisioned
          # repository token explicitly when one is available.
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@v1
        continue-on-error: true
        # NOTE: this MUST be matrix.os, not runner.os. `runner.os` evaluates to
        # Linux/Windows/macOS and can NEVER equal 'ubuntu-latest', so the previous
        # condition was always false and these three steps never ran once.
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24.x'
        with:
          api-token: ${{ secrets.CODACY_API_TOKEN }}
          coverage-reports: ./coverage/lcov.info

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  types:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check renderer
        run: npx vue-tsc --noEmit

      - name: Type check main process
        run: npx tsc -p tsconfig.main.json --noEmit

      - name: Type check tests
        run: npx vue-tsc --noEmit -p tsconfig.test.json

  smoke:
    name: Smoke on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      # Same reasoning as the test job: a Linux smoke failure must not cancel the
      # Windows leg (which has to download Electron + Playwright first).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Run smoke test (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run --auto-servernum npm run smoke

      - name: Run smoke test (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run smoke
